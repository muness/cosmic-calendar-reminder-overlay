version = 1

# An empty include list means no EDS calendars are selected. The EDS adapter
# will apply this policy to both native alarms and fallback scans.
[selection]
mode = "include" # include, exclude, or all
calendars = ["eds-local/8f1f2c7e-opaque-backend-id"]

[calendar]
eds_enabled = false # opt in to the native EDS watcher; false never opens the account registry
follow_selection = true # also require the calendar to be selected in Evolution; set false to use TOML selection alone

[reminders]
fallback_lead_minutes = 5 # 1 through 120

[snooze]
minutes = [1, 5] # 1 through 10080

[display]
backend = "native" # native or fullscreen
outputs = "all" # all, first output, or connector:NAME

[appearance]
theme = "default" # default, dark, or light

[audio]
enabled = false
file = ""
repeat_seconds = 0
volume = 0.5 # app-local playback level from 0.0 to 1.0; system volume is unchanged
